<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لـ بابيتو ❤️</title>
<style>
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Arial;text-align:center;margin:0;padding:0}
.card{max-width:420px;margin:auto;padding:20px}
.lock-card{background:#1a0000;border:2px solid #ff1e3c;border-radius:25px;padding:25px;max-width:380px;margin:40px auto}
input{width:70px;padding:12px;margin:5px;border-radius:12px;border:1px solid #ff1e3c;background:#000;color:white;text-align:center;font-size:18px}
button{background:#ff1e3c;color:white;border:none;padding:13px 30px;border-radius:20px;font-size:18px;margin-top:15px;cursor:pointer}
#gift{display:none}
.top-song{background:#0a0000;border:1px solid #3a1111;border-radius:30px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 20px;font-size:18px}
.top-song span{width:52px;height:52px;background:#ff1e3c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.top-heart{position:relative;margin:10px 0 0}
.big-heart{font-size:170px;line-height:1;text-shadow:0 0 30px #ff1e3c,0 0 60px #ff1e3c;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.08)}40%{transform:scale(0.98)}60%{transform:scale(1.05)}}
.love-pill{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.55);border:1px solid #777;border-radius:30px;padding:7px 22px;font-size:19px}
.hamoudy{font-size:72px;font-style:italic;margin:8px 0 5px}
.msg-box{border:1px solid #3a1111;border-radius:20px;padding:18px;margin:25px 0;background:#0d0000;line-height:1.9;font-size:16px}
.days{margin:20px 0;font-size:18px;color:#ffb3bc}
.days b{font-size:42px;color:#ff1e3c;margin:0 6px}
.section-title{font-size:26px;font-style:italic;margin:40px 0 20px;text-align:right;padding-right:10px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:5px}
.polaroid{background:#0a0000;border:2px solid #4a0000;border-radius:12px;padding:6px 6px 12px;transform:rotate(-3deg)}
.polaroid:nth-child(even){transform:rotate(3deg);margin-top:18px}
.polaroid img{width:100%;height:200px;object-fit:cover;border-radius:8px;display:block}
.polaroid p{margin:10px 4px 0;font-size:13px;line-height:1.6;color:#ffb3bc;font-style:italic}
.record-title{font-size:38px;font-style:italic;margin:40px 0 20px}
.player-wrap{position:relative;width:280px;height:280px;margin:10px auto}
.waves{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg, #ff1e3c 0deg 2deg, transparent 2deg 6deg);opacity:.7;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #ff6b7a, #c8001e);border:2px solid #ff1e3c;font-size:38px;color:white;cursor:pointer;box-shadow:0 0 40px #ff1e3c}
.progress{width:90%;height:6px;background:#222;border-radius:10px;margin:25px auto 8px;overflow:hidden}
.progress div{height:100%;width:0%;background:#ff1e3c}
.times{display:flex;justify-content:space-between;width:90%;margin:auto;font-size:13px;color:#ffb3bc}
iframe#yt{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none}
</style>
</head>
<body>
<div id="lock" class="lock-card">
<h1 style="font-size:50px">❤️</h1>
<h2>اكتب التاريخ عشان تفتح</h2>
<input id="d" placeholder="يوم" type="number">
<input id="m" placeholder="شهر" type="number">
<input id="y" placeholder="سنة" type="number"><br>
<button onclick="openGift()">افتح</button>
<p id="err"></p>
</div>

<div id="gift" class="card">
